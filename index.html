<style>

@media(max-width:860px){.burger{display:block}.links{display:none;position:absolute;left:0;right:0;top:100%;flex-direction:column;align-items:stretch;gap:0;background:var(--bg);border-bottom:1px solid var(--line);padding:8px 24px 20px}.links.open{display:flex}.links a{padding:14px 0;border-bottom:1px solid var(--line)}.links a.btn{margin-top:14px;border:1.5px solid var(--ink)}.sec{padding-top:60px}.strip a{border-right:0;border-bottom:1px solid var(--line)}}

function closeMenus(){$('#links').classList.remove('open');$('#burger').setAttribute('aria-expanded','false');Array.prototype.forEach.call(D.querySelectorAll('.dd.open'),function(d){d.classList.remove('open')})}
function navHtml(){var dm=function(items,kind,label){return '<div class="dm"><a href="#/'+kind+'"><b>'+label+'</b><small>Overview</small></a>'+items.map(function(x){return '<a href="'+(kind==='services'?'#/services#'+x.id:'#/solutions/'+x.id)+'">'+x.t+'</a>'}).join('')+'</div>'};
return '<a href="#/" data-r="home">Home</a><a href="#/about" data-r="about">About</a><div class="dd"><a href="#/services" data-r="services" aria-haspopup="true">Services<span class="cv"></span></a>'+dm(SERV,'services','All services')+'</div><div class="dd"><a href="#/solutions" data-r="solutions" aria-haspopup="true">Solutions<span class="cv"></span></a>'+dm(SOL,'solutions','All solutions')+'</div><a href="#/pricing" data-r="pricing">Pricing</a><a href="#/contact" data-r="contact">Contact</a><a class="btn b1" href="#/contact?t=consultation">Book a Consultation '+ARW+'</a>'}
var tick=false;function onScroll(){if(tick)return;tick=true;requestAnimationFrame(function(){var y=window.pageYOffset||0,h=root.scrollHeight-window.innerHeight;$('#prog').style.transform='scaleX('+(h>0?Math.min(1,y/h):0)+')';$('.hd').classList.toggle('sc',y>8);$('#top').classList.toggle('on',y>700);tick=false})}
$('#links').innerHTML=navHtml();
$('#links').addEventListener('click',function(e){var a=e.target.closest('.dd>a');if(a&&window.innerWidth<=860){e.preventDefault();a.parentNode.classList.toggle('open')}});
$('#burger').addEventListener('click',function(){var o=$('#links').classList.toggle('open');this.setAttribute('aria-expanded',o?'true':'false')});
D.addEventListener('keydown',function(e){if(e.key==='Escape'){closeMenus();if(D.activeElement&&D.activeElement.blur&&D.activeElement.closest&&D.activeElement.closest('.dd'))D.activeElement.blur()}});
$('#skip').addEventListener('click',function(e){e.preventDefault();app.focus();app.scrollIntoView()});
$('#top').addEventListener('click',function(){window.scrollTo({top:0,behavior:RM?'auto':'smooth'})});
window.addEventListener('scroll',onScroll,{passive:true});window.addEventListener('resize',onScroll);
app.addEventListener('mousemove',function(e){var c=e.target.closest&&e.target.closest('.sv,.pil');if(c){var r=c.getBoundingClientRect();c.style.setProperty('--mx',(e.clientX-r.left)+'px');c.style.setProperty('--my',(e.clientY-r.top)+'px')}});
D.addEventListener('mousemove',function(e){var h=$('.herow');if(!h||RM)return;h.style.setProperty('--px',(e.clientX/window.innerWidth-.5).toFixed(3));h.style.setProperty('--py',(e.clientY/window.innerHeight-.5).toFixed(3))});
(function(){var el=$('#intro'),seen=false;try{seen=sessionStorage.getItem('fx_intro')}catch(e){}if(RM||seen){el.parentNode.removeChild(el)}else{root.classList.add('intro-on');try{sessionStorage.setItem('fx_intro','1')}catch(e){}setTimeout(function(){if(el.parentNode)el.parentNode.removeChild(el);root.classList.remove('intro-on')},1500)}})();
window.addEventListener('hashchange',route);route();
})();
</script>
</body>
</html>
