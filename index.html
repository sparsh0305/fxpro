<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<style>
/* ---- CORE BRAND TOKENS (PRESERVED EXACTLY) ---- */
:root {
  --ink: #162522;
  --teal: #6DB8AB;
  --tealD: #538C82;
  --tx: #2C6A60;
  --gold: #DEC796;
  --goldD: #B5985A;
  --tint: #F0F8F7;
  --bg: #FBFCFB;
  --line: #DDE7E4;
  --mut: #52625E;
  --x: var(--ink);
  --serif: 'Inter', system-ui, -apple-system, sans-serif;
  --ease: cubic-bezier(.22, .61, .36, 1);
  --spring: cubic-bezier(.34, 1.56, .64, 1);
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}

html {
  scroll-padding-top: calc(82px + env(safe-area-inset-top, 0px));
  scroll-behavior: smooth;
}
*, *:before, *:after { box-sizing: inherit; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}
body.menu-open {
  overflow: hidden;
  touch-action: none;
}
h1, h2, h3, h4, .sf { font-family: var(--serif); }
.sg { font-family: 'Inter', system-ui, sans-serif; }
a { color: inherit; }

/* ---- REFINED TYPOGRAPHY ---- */
.eb {
  font-size: 11.5px;
  font-weight: 600;
  letter-spacing: .16em;
  color: var(--tx);
  text-transform: uppercase;
}
.h1, .e-hero .h1 {
  font-size: clamp(32px, 3.8vw, 48px);
  line-height: 1.15;
  letter-spacing: -.03em;
  font-weight: 600;
  margin: 12px 0 16px;
  max-width: 22ch;
}
.h2, .e-h {
  font-size: clamp(23px, 2.5vw, 34px);
  line-height: 1.22;
  letter-spacing: -.02em;
  font-weight: 600;
  margin: 10px 0 0;
  max-width: 26ch;
}
.h3 {
  font-size: clamp(17.5px, 1.7vw, 21px);
  line-height: 1.28;
  letter-spacing: -.015em;
  font-weight: 600;
  margin: 0 0 6px;
}
.lead, .e-lead {
  font-size: clamp(15px, 1.1vw, 17px);
  line-height: 1.6;
  color: var(--mut);
  max-width: 560px;
  margin: 0 0 20px;
}
.em {
  background: linear-gradient(transparent 58%, #E7DCBB 58%);
  font-weight: 600;
}
.e-lab {
  display: flex;
  align-items: center;
  gap: 12px;
  font: 600 11.5px 'Inter', sans-serif;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: var(--tx);
}
.e-lab span {
  font: 700 13px 'Space Grotesk', sans-serif;
  color: var(--goldD);
}
.e-lab:after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--line);
}

/* ---- SPACING & STRUCTURED CONTAINERS ---- */
.w {
  max-width: 1200px;
  margin: 0 auto;
  padding: 0 24px;
}
.row {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  align-items: center;
}
.sec { padding: 54px 0 0; }
.e-s { padding: 64px 0 0; }
.ph { padding: 30px 0 0; }
.e-2 {
  display: grid;
  grid-template-columns: minmax(0, 5fr) minmax(0, 6.8fr);
  gap: 40px;
  align-items: start;
}
.e-2 > :first-child {
  position: sticky;
  top: 96px;
}

/* Balanced 2-column page intro grid to eliminate empty white space */
.intro-2col {
  display: grid;
  grid-template-columns: minmax(0, 5.2fr) minmax(0, 6.8fr);
  gap: 40px;
  align-items: center;
  padding: 16px 0 10px;
}

/* ---- BUTTONS & CONTROLS ---- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 11px 19px;
  border-radius: 11px;
  font: 600 14px 'Inter', sans-serif;
  text-decoration: none;
  border: 1.5px solid var(--ink);
  cursor: pointer;
  background: none;
  color: var(--ink);
  position: relative;
  overflow: hidden;
  isolation: isolate;
  transition: border-color .25s, color .25s, transform .2s var(--ease), box-shadow .25s;
}
.btn:before {
  content: '';
  position: absolute;
  inset: 0;
  transform: translateY(102%);
  transition: transform .35s var(--ease);
  z-index: -1;
}
.b1 { background: var(--ink); color: #fff; }
.b1:before { background: var(--tx); }
.b2 { background: transparent; color: var(--ink); border-color: var(--line); }
.b2:before { background: var(--tint); }
.b2:hover { border-color: var(--tx); }
.b3 { background: var(--teal); border-color: var(--teal); color: var(--ink); }
.b3:before { background: #fff; }
.btn:hover:before { transform: none; }
.btn:hover { box-shadow: 0 10px 22px -14px rgba(22, 37, 34, .45); }
.btn:active { transform: scale(.98); }
.btn span[aria-hidden] {
  display: inline-block;
  transition: transform .25s var(--ease);
}
.btn:hover span[aria-hidden] {
  transform: translate(3px, -3px);
}
:focus-visible {
  outline: 3px solid var(--tx);
  outline-offset: 2px;
}
.skip {
  position: fixed;
  left: 16px;
  top: -60px;
  z-index: 210;
  background: var(--ink);
  color: #fff;
  padding: 10px 16px;
  border-radius: 10px;
  text-decoration: none;
  transition: top .2s;
}
.skip:focus { top: 12px; }
.prog {
  position: fixed;
  left: 0;
  top: 0;
  height: 3px;
  width: 100%;
  transform-origin: 0 50%;
  transform: scaleX(0);
  background: linear-gradient(90deg, var(--teal), var(--gold));
  z-index: 80;
  pointer-events: none;
}

/* ---- LOGO-FIRST LOADING EXPERIENCE ---- */
.intro {
  position: fixed;
  inset: 0;
  z-index: 200;
  background: var(--bg);
  display: flex;
  align-items: center;
  justify-content: center;
  pointer-events: none;
  opacity: 1;
  transition: opacity .45s var(--ease), visibility .45s;
}
.intro.fade-out {
  opacity: 0;
  visibility: hidden;
}
.intro-inner {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  animation: introPop .7s var(--spring) forwards;
}
.intro-mark svg {
  width: 72px;
  height: 72px;
  filter: drop-shadow(0 12px 24px rgba(44, 106, 96, .2));
}
.intro-brand {
  font: 700 28px 'Space Grotesk', sans-serif;
  letter-spacing: -.04em;
  color: var(--ink);
}
.intro-brand i {
  font-style: normal;
  color: var(--ink);
}
.intro-sub {
  font: 600 10.5px 'Inter', sans-serif;
  letter-spacing: .22em;
  color: var(--tx);
  opacity: 0;
  transform: translateY(4px);
  animation: introSub .5s var(--ease) .25s forwards;
}
@keyframes introPop {
  from { opacity: 0; transform: scale(.88); }
  to { opacity: 1; transform: scale(1); }
}
@keyframes introSub {
  to { opacity: .85; transform: translateY(0); }
}

/* ---- STICKY HEADER & MAIN NAVIGATION ---- */
.hd {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 30;
  background: rgba(251, 252, 251, .94);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
  transition: box-shadow .3s var(--ease), background .3s;
}
.hd.sc {
  box-shadow: 0 10px 26px -20px rgba(22, 37, 34, .4);
  background: rgba(251, 252, 251, .98);
}
.nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 12px 24px;
  max-width: 1200px;
  margin: 0 auto;
  transition: padding .25s var(--ease);
}
.hd.sc .nav {
  padding-top: 8px;
  padding-bottom: 8px;
}
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  text-decoration: none;
}
.brand svg {
  width: 36px;
  height: 36px;
  transition: transform .5s var(--spring);
}
.brand:hover svg {
  transform: rotate(-8deg) scale(1.06);
}
.lg {
  font: 700 25px 'Space Grotesk', sans-serif;
  letter-spacing: -.04em;
}
.lg i {
  font-style: normal;
  color: var(--x);
}

.links {
  display: flex;
  align-items: center;
  gap: 22px;
}
.links > a {
  text-decoration: none;
  font-size: 14.5px;
  font-weight: 500;
  color: #33423E;
  padding: 6px 0;
  position: relative;
  transition: color .2s;
}
.links > a:hover { color: var(--tx); }
.links > a:not(.btn):after, .dd > a:after {
  content: '';
  position: absolute;
  left: 0;
  right: 0;
  bottom: -2px;
  height: 2px;
  background: var(--teal);
  transform: scaleX(0);
  transform-origin: 0 50%;
  transition: transform .3s var(--ease);
}
.links > a:not(.btn):hover:after, .dd:hover > a:after {
  transform: scaleX(1);
}
.links a.on:after {
  transform: scaleX(1) !important;
}
.links a.btn {
  color: #fff;
  padding: 10px 18px;
  font-size: 14px;
  border: 1.5px solid var(--ink);
  margin-left: 4px;
}

/* Dropdown */
.dd { position: relative; }
.dd > a {
  text-decoration: none;
  font-size: 14.5px;
  font-weight: 500;
  color: #33423E;
  padding: 6px 2px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  cursor: pointer;
  position: relative;
}
.dd > a span.cv {
  display: inline-block;
  width: 5px;
  height: 5px;
  border-right: 1.5px solid currentColor;
  border-bottom: 1.5px solid currentColor;
  transform: rotate(45deg) translateY(-2px);
  transition: transform .25s var(--ease);
}
.dd:hover > a span.cv, .dd.open > a span.cv {
  transform: rotate(-135deg) translateY(-1px);
}
.dm {
  position: absolute;
  top: calc(100% + 6px);
  left: -20px;
  min-width: 350px;
  padding: 10px;
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 16px;
  box-shadow: 0 28px 52px -24px rgba(22, 37, 34, .38);
  opacity: 0;
  visibility: hidden;
  transform: translateY(10px);
  transition: opacity .22s var(--ease), transform .22s var(--ease), visibility .22s;
  z-index: 50;
}
.dd:hover .dm, .dd:focus-within .dm, .dd.open .dm {
  opacity: 1;
  visibility: visible;
  transform: none;
}
.dm-head {
  padding: 10px 14px 8px;
  border-bottom: 1px solid var(--line);
  margin-bottom: 6px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.dm-head b {
  font-size: 12px;
  font-weight: 700;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--tx);
}
.dm-head a {
  font-size: 12px;
  font-weight: 600;
  color: var(--ink);
  text-decoration: underline;
  text-underline-offset: 3px;
}
.links .dm a.d-item {
  display: block;
  padding: 9px 12px;
  border-radius: 9px;
  border: 0;
  font-size: 14px;
  font-weight: 500;
  color: var(--ink);
  position: relative;
  text-decoration: none;
  transition: background .18s, padding-left .2s var(--ease);
}
.links .dm a.d-item:after { display: none; }
.links .dm a.d-item:hover {
  background: var(--tint);
  padding-left: 17px;
  color: var(--tx);
}
.links .dm a.d-item small {
  display: block;
  font-size: 12px;
  color: var(--mut);
  font-weight: 400;
  margin-top: 1px;
}

/* ---- BURGER & MODERN MOBILE DRAWER ---- */
.burger {
  display: none;
  background: none;
  border: 1.5px solid var(--line);
  border-radius: 10px;
  padding: 9px 10px;
  cursor: pointer;
  position: relative;
  z-index: 105;
  transition: border-color .2s, background .2s;
}
.burger:hover {
  border-color: var(--ink);
  background: var(--tint);
}
.burger span.b-line {
  display: block;
  width: 19px;
  height: 2px;
  background: var(--ink);
  margin: 4px 0;
  border-radius: 2px;
  transition: transform .25s var(--ease), opacity .2s;
}
.burger[aria-expanded="true"] span.b-line-1 {
  transform: translateY(6px) rotate(45deg);
}
.burger[aria-expanded="true"] span.b-line-2 {
  opacity: 0;
}
.burger[aria-expanded="true"] span.b-line-3 {
  transform: translateY(-6px) rotate(-45deg);
}

.mobile-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(22, 37, 34, .45);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  z-index: 95;
  opacity: 0;
  visibility: hidden;
  transition: opacity .3s var(--ease), visibility .3s;
}
.mobile-backdrop.open {
  opacity: 1;
  visibility: visible;
}

.mobile-drawer {
  position: fixed;
  top: 0;
  right: 0;
  bottom: 0;
  width: min(86vw, 380px);
  background: #FBFCFB;
  border-left: 1px solid var(--line);
  z-index: 100;
  display: flex;
  flex-direction: column;
  transform: translateX(101%);
  transition: transform .32s var(--ease);
  box-shadow: -12px 0 36px -12px rgba(22, 37, 34, .25);
  overflow: hidden;
}
.mobile-drawer.open {
  transform: translateX(0);
}
.drawer-head {
  padding: 16px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--line);
  background: #fff;
}
.drawer-content {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 14px 18px 24px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.d-link {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 14px;
  border-radius: 11px;
  text-decoration: none;
  font-size: 15px;
  font-weight: 500;
  color: var(--ink);
  transition: background .15s, color .15s;
}
.d-link:hover, .d-link.on {
  background: var(--tint);
  color: var(--tx);
  font-weight: 600;
}
.d-acc-btn {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 14px;
  border-radius: 11px;
  background: none;
  border: 0;
  font: 500 15px 'Inter', sans-serif;
  color: var(--ink);
  cursor: pointer;
  text-align: left;
  transition: background .15s;
}
.d-acc-btn:hover { background: var(--tint); }
.d-acc-btn span.acc-icon {
  display: inline-block;
  width: 7px;
  height: 7px;
  border-right: 2px solid currentColor;
  border-bottom: 2px solid currentColor;
  transform: rotate(45deg);
  transition: transform .25s var(--ease);
}
.d-acc.expanded .d-acc-btn span.acc-icon {
  transform: rotate(-135deg);
}
.d-acc-body {
  display: none;
  padding: 4px 0 8px 14px;
  border-left: 2px solid var(--line);
  margin: 2px 0 6px 14px;
}
.d-acc.expanded .d-acc-body {
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.d-acc-body a {
  display: block;
  padding: 9px 12px;
  border-radius: 8px;
  text-decoration: none;
  font-size: 13.5px;
  color: #33423E;
  transition: background .15s, color .15s;
}
.d-acc-body a:hover {
  background: var(--tint);
  color: var(--tx);
}
.d-acc-body a.d-overview {
  font-weight: 600;
  color: var(--tx);
  border-bottom: 1px dashed var(--line);
  margin-bottom: 4px;
}
.drawer-foot {
  padding: 16px 20px calc(18px + env(safe-area-inset-bottom, 0px));
  border-top: 1px solid var(--line);
  background: #fff;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.drawer-foot .btn { width: 100%; }
.drawer-contact-info {
  font-size: 12px;
  color: var(--mut);
  line-height: 1.5;
  display: flex;
  justify-content: space-between;
}
.drawer-contact-info a {
  color: var(--tx);
  font-weight: 600;
  text-decoration: none;
}
.drawer-social {
  display: flex;
  gap: 8px;
  margin-top: 4px;
}

/* ---- REFINED HOMEPAGE HERO (INTEGRATED 2-COLUMN COMPOSITION) ---- */
.herow {
  position: relative;
  overflow: hidden;
}
.herow .hero {
  position: relative;
  z-index: 1;
}
.hero {
  display: grid;
  gap: 36px;
  align-items: center;
  padding: 30px 0 46px;
}
.e-hero {
  grid-template-columns: minmax(0, 5.2fr) minmax(0, 6.8fr) !important;
  gap: 40px !important;
  align-items: center !important;
}
.hero-left {
  display: flex;
  flex-direction: column;
}
.hero-badges {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 20px;
}
.h-pill {
  font: 500 12px 'Inter', sans-serif;
  color: var(--tx);
  background: var(--tint);
  border: 1px solid #CFE3DF;
  border-radius: 999px;
  padding: 4px 12px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.h-pill:before {
  content: '';
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--tealD);
}

.e-idx {
  display: flex;
  gap: 24px;
  margin-top: 24px;
  padding-top: 16px;
  border-top: 1px solid var(--line);
}
.e-idx b {
  display: block;
  font: 700 26px 'Space Grotesk', sans-serif;
  color: var(--tx);
  letter-spacing: -.03em;
}
.e-idx span {
  font-size: 12.5px;
  color: var(--mut);
}

/* Treasury & FX Terminal Card */
.e-fx {
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 20px 22px 18px;
  box-shadow: 0 24px 48px -28px rgba(22, 37, 34, .25);
  position: relative;
}
.e-fh {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
}
.e-tb {
  display: flex;
  gap: 5px;
}
.e-tb button {
  font: 600 12px 'Inter', sans-serif;
  border: 1px solid var(--line);
  background: var(--bg);
  padding: 5px 11px;
  border-radius: 7px;
  color: var(--mut);
  cursor: pointer;
  transition: background .2s, color .2s, border-color .2s;
}
.e-tb button:hover {
  background: var(--tint);
  color: var(--ink);
  border-color: #BFD3CE;
}
.e-tb [aria-selected=true] {
  background: var(--ink);
  color: #fff;
  border-color: var(--ink);
}
.tag {
  font-size: 10px;
  letter-spacing: .14em;
  border: 1px solid #BFD3CE;
  background: var(--tint);
  border-radius: 6px;
  padding: 3px 8px;
  color: var(--tx);
  font-weight: 600;
}
.e-ro {
  display: flex;
  gap: 22px;
  margin: 14px 0 6px;
  font-size: 12px;
  color: var(--mut);
}
.e-ro b {
  display: block;
  font: 700 23px 'Space Grotesk', sans-serif;
  letter-spacing: -.03em;
  color: var(--ink);
  margin-top: 2px;
}
.e-ro .lk b { color: var(--goldD); }
.e-plot {
  width: 100%;
  height: auto;
  display: block;
  touch-action: pan-y;
  cursor: crosshair;
}
.e-gl { stroke: var(--line); stroke-width: 1; }
.e-lk { stroke: var(--goldD); stroke-width: 2; stroke-dasharray: 5 5; }
.e-line {
  stroke: var(--tealD);
  stroke-width: 2.4;
  fill: none;
  stroke-linejoin: round;
  stroke-dasharray: 1;
  stroke-dashoffset: 1;
  animation: e-draw 1.6s var(--ease) .6s forwards;
}
@keyframes e-draw { to { stroke-dashoffset: 0; } }

/* Floating Micro-Insight Scenario Badge */
.fx-scenario {
  margin-top: 14px;
  background: var(--tint);
  border: 1px solid #CFE3DF;
  border-radius: 12px;
  padding: 12px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  font-size: 12.5px;
}
.fx-scenario-left {
  display: flex;
  align-items: center;
  gap: 10px;
}
.fx-scenario-badge {
  font: 700 10px 'Inter', sans-serif;
  letter-spacing: .06em;
  text-transform: uppercase;
  background: var(--tx);
  color: #fff;
  border-radius: 4px;
  padding: 2px 6px;
}
.fx-scenario-val {
  font-weight: 600;
  color: var(--ink);
}
.fx-scenario-tag {
  color: var(--tx);
  font-size: 11.5px;
  font-weight: 600;
}

/* ---- CUSTOM FINANCIAL ARCHITECTURE VISUAL (ABOUT PAGE) ---- */
.about-visual {
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 24px;
  box-shadow: 0 24px 48px -28px rgba(22, 37, 34, .25);
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.av-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid var(--line);
  padding-bottom: 12px;
}
.av-title {
  font: 600 13px 'Inter', sans-serif;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--tx);
}
.av-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
.av-node {
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  transition: border-color .2s, background .2s;
}
.av-node:hover {
  border-color: var(--teal);
  background: #fff;
}
.av-tag {
  font: 700 10px 'Space Grotesk', sans-serif;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--goldD);
}
.av-name {
  font: 600 13.5px 'Inter', sans-serif;
  color: var(--ink);
  margin: 0;
}
.av-desc {
  font-size: 11.5px;
  color: var(--mut);
  line-height: 1.45;
  margin: 0;
}
.av-hub {
  background: var(--tint);
  border: 1.5px solid #CFE3DF;
  border-radius: 12px;
  padding: 14px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
}
.av-hub-title {
  font: 700 13px 'Space Grotesk', sans-serif;
  letter-spacing: -.01em;
  color: var(--ink);
}
.av-hub-desc {
  font-size: 12px;
  color: var(--tx);
  font-weight: 500;
}
.av-hub-mark svg {
  width: 32px;
  height: 32px;
}
.av-metrics {
  display: flex;
  justify-content: space-between;
  padding-top: 10px;
  border-top: 1px solid var(--line);
  font-size: 12px;
  color: var(--mut);
}
.av-metrics b { color: var(--ink); }

/* ---- FOUR OPERATIONAL ENGINES VISUAL (SERVICES PAGE) ---- */
.services-visual {
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 24px;
  box-shadow: 0 24px 48px -28px rgba(22, 37, 34, .25);
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.sv-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid var(--line);
  padding-bottom: 12px;
}
.sv-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
.sv-card {
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  transition: border-color .2s, transform .2s var(--ease);
}
.sv-card:hover {
  border-color: var(--teal);
  transform: translateY(-2px);
  background: #fff;
}
.sv-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.sv-k {
  font: 700 12px 'Space Grotesk', sans-serif;
  color: var(--goldD);
}
.sv-card h4 {
  margin: 0;
  font: 600 13.5px 'Inter', sans-serif;
  color: var(--ink);
}
.sv-card p {
  margin: 0;
  font-size: 11.5px;
  color: var(--mut);
  line-height: 1.45;
}
.sv-bar {
  background: var(--tint);
  border: 1px solid #CFE3DF;
  border-radius: 10px;
  padding: 10px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 12px;
  color: var(--tx);
  font-weight: 600;
}

/* SECTION 01 — EXPERTISE INDEX */
.e-ix {
  display: flex;
  flex-direction: column;
}
.e-ix a {
  display: grid;
  grid-template-columns: 48px minmax(0, 1.1fr) minmax(0, 1.2fr) 28px;
  gap: 20px;
  align-items: baseline;
  padding: 22px 0;
  border-top: 1px solid var(--line);
  text-decoration: none;
  transition: padding-left .25s var(--ease);
}
.e-ix a:last-child { border-bottom: 1px solid var(--line); }
.e-ix .n {
  font: 700 13px 'Space Grotesk', sans-serif;
  color: var(--goldD);
  transition: color .2s;
}
.e-ix p {
  margin: 0;
  color: var(--mut);
  font-size: 14.5px;
  line-height: 1.5;
}
.e-ix a > span:last-child {
  font-size: 19px;
  color: var(--tx);
  transition: transform .25s var(--ease);
}
.e-ix a:hover { padding-left: 10px; }
.e-ix a:hover h3 { color: var(--tx); }
.e-ix a:hover .n { color: var(--tx); }
.e-ix a:hover > span:last-child { transform: translate(3px, -3px); }

/* SECTION 02 — COST CALCULATOR */
.card {
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 18px;
  box-shadow: 0 24px 48px -28px rgba(22, 37, 34, .25);
  overflow: hidden;
}
.ch {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 14px 20px;
  background: var(--tint);
  border-bottom: 1px solid var(--line);
  font: 600 14.5px 'Inter', sans-serif;
}
.cb { padding: 20px; }
.fld {
  display: grid;
  gap: 5px;
  font-size: 12.5px;
  font-weight: 600;
  color: #33423E;
}
.in {
  width: 100%;
  border: 1.5px solid #C9D8D3;
  border-radius: 10px;
  padding: 11px 13px;
  background: #fff;
  font: 400 14.5px 'Inter', sans-serif;
  color: var(--ink);
  transition: border-color .2s, box-shadow .2s;
}
.in:focus {
  border-color: var(--tx);
  box-shadow: 0 0 0 3px rgba(109, 184, 171, .28);
  outline: 0;
}
.in.bad { border-color: #B03A2E; }
.err { color: #B03A2E; font-size: 11.5px; font-weight: 500; }
.g2 {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
  gap: 12px;
}
.opt {
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 12px;
  display: grid;
  gap: 8px;
  background: #FBFDFC;
}
.opt b { font: 600 13px 'Inter', sans-serif; color: var(--ink); }
.res {
  margin-top: 14px;
  display: grid;
  gap: 10px;
}
.rr {
  display: grid;
  gap: 5px;
  font-size: 13.5px;
}
.rr .t {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  font-weight: 600;
}
.bar {
  height: 7px;
  border-radius: 8px;
  background: #E4ECEA;
  overflow: hidden;
}
.bar i {
  display: block;
  height: 100%;
  background: #BCCAC6;
  border-radius: 8px;
  transition: width .35s;
}
.rr.best .bar i { background: var(--teal); }
.rr.best .t span:first-child:after {
  content: 'LOWEST';
  font-size: 9.5px;
  letter-spacing: .12em;
  background: var(--gold);
  border-radius: 4px;
  padding: 2px 6px;
  margin-left: 8px;
  font-weight: 700;
}
.note {
  font-size: 11.5px;
  color: #6D7F7A;
  margin-top: 10px;
  line-height: 1.5;
}
.chip {
  border: 1.5px solid var(--line);
  background: #fff;
  border-radius: 999px;
  padding: 8px 15px;
  font: 500 13.5px 'Inter', sans-serif;
  cursor: pointer;
  text-decoration: none;
  color: var(--ink);
  transition: background .2s, color .2s, border-color .2s;
}
.chip:hover, .chip.on {
  background: var(--ink);
  color: #fff;
  border-color: var(--ink);
}
.chip.sm {
  padding: 6px 12px;
  font-size: 12px;
}

/* SECTION 03 — FOLLOW THE MONEY TIMELINE */
.e-tabs { margin-top: 24px; }
.e-st {
  display: flex;
  position: relative;
  gap: 4px;
}
.e-st:before {
  content: '';
  position: absolute;
  left: 4%;
  right: 4%;
  top: 20px;
  height: 2px;
  background: var(--line);
  z-index: 0;
}
.e-st button {
  flex: 1;
  background: none;
  border: 0;
  cursor: pointer;
  display: grid;
  justify-items: center;
  gap: 8px;
  font: 600 13px 'Inter', sans-serif;
  color: var(--mut);
  position: relative;
  z-index: 1;
  padding: 0 4px;
}
.e-st i {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: #fff;
  border: 2px solid var(--line);
  display: grid;
  place-items: center;
  font: 700 13px 'Space Grotesk', sans-serif;
  font-style: normal;
  transition: background .25s, border-color .25s, color .25s, transform .3s var(--spring);
}
.e-st button:hover i {
  border-color: var(--teal);
  transform: scale(1.06);
}
.e-st [aria-selected=true] {
  color: var(--ink);
}
.e-st [aria-selected=true] i {
  background: var(--tealD);
  border-color: var(--tealD);
  color: #fff;
}
.stage-panel {
  margin-top: 24px;
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 22px 26px;
  box-shadow: 0 12px 30px -20px rgba(22, 37, 34, .18);
  display: grid;
  grid-template-columns: minmax(0, 7fr) minmax(0, 5fr);
  gap: 26px;
  align-items: center;
}
.stage-desc {
  font-size: clamp(16px, 1.7vw, 19.5px);
  line-height: 1.45;
  letter-spacing: -.01em;
  color: var(--ink);
  margin: 0;
}
.stage-adv {
  background: var(--tint);
  border: 1px solid #CFE3DF;
  border-radius: 12px;
  padding: 14px 16px;
  font-size: 13px;
  color: #33423E;
  line-height: 1.55;
}
.stage-adv b {
  display: block;
  color: var(--tx);
  font-size: 11px;
  letter-spacing: .08em;
  text-transform: uppercase;
  margin-bottom: 4px;
}

/* SECTION 04 — CHALLENGES */
.challenge-grid {
  display: grid;
  gap: 14px;
}
.challenge-item {
  padding: 18px 20px;
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 14px;
  transition: border-color .2s, box-shadow .2s;
}
.challenge-item:hover {
  border-color: #BFD3CE;
  box-shadow: 0 10px 24px -16px rgba(22, 37, 34, .2);
}
.challenge-item h3 {
  font-size: 17.5px;
  margin: 0 0 5px;
  font-weight: 600;
  color: var(--ink);
}
.challenge-item p {
  margin: 0;
  color: var(--mut);
  font-size: 14px;
  line-height: 1.55;
}
.challenge-item .fx {
  color: var(--tx);
  font-weight: 600;
  margin-top: 8px;
  padding-left: 12px;
  border-left: 3px solid var(--gold);
  font-size: 13.5px;
}

/* SECTION 05 — OUR APPROACH (DARK SECTION) */
.e-dk {
  background: var(--ink);
  color: #fff;
  margin-top: 72px;
  padding: 70px 0;
}
.e-dk .e-lab { color: var(--teal); }
.e-dk .e-lab:after { background: rgba(255, 255, 255, .18); }
.e-dk .e-h { color: #fff; }
.e-ap {
  margin-top: 36px;
  display: flex;
  flex-direction: column;
}
.e-ap > div {
  display: grid;
  grid-template-columns: 80px minmax(0, 1.1fr) minmax(0, 1.4fr);
  gap: 20px;
  align-items: baseline;
  padding: 20px 0;
  border-top: 1px solid rgba(255, 255, 255, .15);
  transition: border-color .25s;
}
.e-ap b {
  font: 700 clamp(30px, 3.2vw, 40px) 'Space Grotesk', sans-serif;
  color: var(--teal);
  letter-spacing: -.03em;
  transition: color .25s;
}
.e-ap h3 {
  font-size: clamp(19px, 2vw, 23px);
  margin: 0;
  font-weight: 600;
  letter-spacing: -.015em;
}
.e-ap p {
  margin: 0;
  color: rgba(255, 255, 255, .72);
  font-size: 14.5px;
  line-height: 1.55;
}
.e-ap > div:hover { border-color: var(--gold); }
.e-ap > div:hover b { color: var(--gold); }

/* SECTION 06 — SERVICES OVERVIEW LIST */
.e-sv {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 360px), 1fr));
  column-gap: 44px;
  margin-top: 28px;
}
.e-sv a {
  display: grid;
  grid-template-columns: 32px 1fr 22px;
  gap: 12px;
  align-items: baseline;
  padding: 16px 0;
  border-top: 1px solid var(--line);
  text-decoration: none;
  font: 600 16.5px 'Inter', sans-serif;
  letter-spacing: -.01em;
  transition: color .2s, padding-left .25s var(--ease);
}
.e-sv a span:first-child {
  font: 700 12px 'Space Grotesk', sans-serif;
  color: var(--goldD);
}
.e-sv a:hover {
  color: var(--tx);
  padding-left: 8px;
}

/* SECTION 07 — WHO WE SERVE GRID */
.serve-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr));
  gap: 16px;
  margin-top: 30px;
}
.serve-card {
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 22px 24px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: 12px;
  text-decoration: none;
  color: inherit;
  transition: border-color .25s, transform .25s var(--ease), box-shadow .25s;
}
.serve-card:hover {
  border-color: var(--teal);
  transform: translateY(-3px);
  box-shadow: 0 16px 36px -20px rgba(44, 106, 96, .35);
}
.serve-meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}
.serve-tag {
  font: 600 11px 'Inter', sans-serif;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--tx);
  background: var(--tint);
  border: 1px solid #CFE3DF;
  border-radius: 6px;
  padding: 3px 8px;
}
.serve-card h3 {
  font-size: 17.5px;
  font-weight: 600;
  letter-spacing: -.015em;
  margin: 0;
  color: var(--ink);
  transition: color .2s;
}
.serve-card:hover h3 { color: var(--tx); }
.serve-card p {
  margin: 0;
  color: var(--mut);
  font-size: 13.5px;
  line-height: 1.55;
  flex: 1;
}
.serve-act {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font: 600 12.5px 'Inter', sans-serif;
  color: var(--tx);
  padding-top: 10px;
  border-top: 1px solid #EDF3F1;
}
.serve-act span[aria-hidden] {
  transition: transform .25s var(--ease);
}
.serve-card:hover .serve-act span[aria-hidden] {
  transform: translate(3px, -3px);
}

/* SECTION 08 — FINAL CTA STRIP */
.e-end {
  margin-top: 72px;
  background: var(--tint);
  border-top: 1px solid var(--line);
  padding: 68px 0;
}
.e-cx {
  margin-top: 36px;
  padding-top: 16px;
  border-top: 1px solid var(--line);
  color: var(--mut);
  display: flex;
  flex-wrap: wrap;
  gap: 8px 18px;
  align-items: center;
  font-size: 13.5px;
}
.e-cx a {
  color: var(--tx);
  font-weight: 600;
}

/* ---- SERVICES & SOLUTIONS DEDICATED PAGES ---- */
.chips.stick {
  position: sticky;
  top: calc(62px + env(safe-area-inset-top, 0px));
  z-index: 20;
  background: rgba(251, 252, 251, .94);
  backdrop-filter: blur(8px);
  padding: 10px 0;
  margin-top: 24px;
  margin-bottom: 0;
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.svb {
  display: grid;
  padding: 40px 0;
  border-top: 1px solid var(--line);
}
.pil {
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 22px;
  display: grid;
  gap: 10px;
  align-content: start;
}
.pil p {
  margin: 0;
  color: var(--mut);
  font-size: 14px;
}
.num {
  font: 600 11.5px 'Inter', sans-serif;
  color: #7C8E89;
  letter-spacing: .08em;
}
.ul {
  margin: 0;
  padding: 0;
  list-style: none;
  display: grid;
  gap: 8px;
}
.ul li {
  padding-left: 18px;
  position: relative;
  font-size: 14px;
  color: #33423E;
  line-height: 1.5;
}
.ul li:before {
  content: '';
  position: absolute;
  left: 0;
  top: 7px;
  width: 7px;
  height: 7px;

}
.fn {
  font-size: 12px;
  color: #6D7F7A;
  border-left: 3px solid var(--gold);
  padding-left: 12px;
  margin-top: 14px;
  line-height: 1.5;
}
.crumb {
  font-size: 13px;
  color: #7C8E89;
  margin-bottom: 12px;
}
.crumb a { text-decoration: none; }
.crumb a:hover { color: var(--tx); }
.tbl {
  width: 100%;
  border-collapse: collapse;
  background: #fff;
  font-size: 14px;
  min-width: 520px;
}
.tw {
  overflow-x: auto;
  border: 1px solid var(--line);
  border-radius: 14px;
}
.tbl th {
  background: var(--tint);
  text-align: left;
  padding: 12px 16px;
  font: 600 13.5px 'Inter', sans-serif;
  color: var(--ink);
}
.tbl td {
  padding: 12px 16px;
  border-top: 1px solid #E6EEEC;
  vertical-align: top;
}
.tbl td:first-child { font-weight: 600; }

/* ---- FORMS & CONSULTATION / CONTACT EXPERIENCES ---- */
.form { display: grid; gap: 14px; }
.f2 {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
  gap: 14px;
}
.ok {
  background: var(--tint);
  border: 1px solid #CFE3DF;
  border-radius: 14px;
  padding: 22px;
}
.pre {
  white-space: pre-wrap;
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 14px;
  font-size: 13px;
  line-height: 1.5;
  margin: 14px 0;
}
.contact-meta-card {
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 22px;
  display: grid;
  gap: 14px;
}
.c-item b {
  display: block;
  font-size: 11.5px;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--tx);
  margin-bottom: 2px;
}
.c-item p, .c-item a {
  margin: 0;
  font-size: 14px;
  color: var(--ink);
  text-decoration: none;
}
.c-item a:hover { color: var(--tx); text-decoration: underline; }

/* ---- FOOTER & SOCIAL LINKS AREA ---- */
.ft {
  background: var(--tint);
  border-top: 1px solid var(--line);
  color: #41524E;
  font-size: 13.5px;
  margin-top: 0;
}
.fc {
  display: grid;
  grid-template-columns: 1.4fr repeat(3, 1fr);
  gap: 32px;
  padding: 44px 0 20px;
}
.fc h4 {
  margin: 0 0 12px;
  font: 600 14px 'Inter', sans-serif;
  color: var(--ink);
}
.fc a {
  display: block;
  color: #41524E;
  text-decoration: none;
  margin: 0 0 8px;
  font-size: 13px;
  transition: color .2s, padding-left .2s var(--ease);
}
.fc a:hover {
  color: var(--tx);
  padding-left: 4px;
}

/* Dedicated Social Media Block */
.ft-social {
  margin-top: 20px;
  padding-top: 18px;
  border-top: 1px solid var(--line);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
}
.ft-social-label {
  font: 600 12px 'Inter', sans-serif;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--tx);
}
.ft-social-icons {
  display: flex;
  gap: 10px;
  align-items: center;
}
.soc-btn {
  width: 36px;
  height: 36px;
  border-radius: 9px;
  border: 1px solid var(--line);
  background: #fff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: var(--ink);
  text-decoration: none;
  transition: background .2s, border-color .2s, color .2s, transform .2s var(--ease);
}
.soc-btn svg { width: 17px; height: 17px; }
.soc-btn:hover {
  background: var(--tint);
  border-color: var(--teal);
  color: var(--tx);
  transform: translateY(-2px);
}
.soc-btn.unlinked {
  opacity: .55;
  cursor: not-allowed;
  background: #F8FAF9;
  border-color: #E2EAE7;
}
.soc-btn.unlinked:hover {
  transform: none;
  background: #F8FAF9;
  border-color: #E2EAE7;
  color: var(--ink);
}

.lgl {
  border-top: 1px solid var(--line);
  padding: 18px 0 calc(28px + env(safe-area-inset-bottom, 0px));
  font-size: 11.5px;
  line-height: 1.65;
  color: #5F716C;
}
.lgl a {
  color: inherit;
  text-decoration: underline;
  text-underline-offset: 3px;
}

/* Toast & Back to Top */
.toast {
  position: fixed;
  left: 50%;
  bottom: 24px;
  transform: translate(-50%, 20px);
  background: var(--ink);
  color: #fff;
  padding: 10px 18px;
  border-radius: 10px;
  font-size: 13px;
  font-weight: 500;
  opacity: 0;
  pointer-events: none;
  transition: opacity .25s, transform .3s var(--spring);
  z-index: 120;
}
.toast.on {
  opacity: 1;
  transform: translate(-50%, 0);
}
.top {
  position: fixed;
  right: 20px;
  bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  width: 42px;
  height: 42px;
  border-radius: 50%;
  background: var(--ink);
  color: #fff;
  border: 0;
  cursor: pointer;
  opacity: 0;
  pointer-events: none;
  transform: translateY(12px);
  transition: opacity .25s, transform .35s var(--ease), background .2s;
  z-index: 70;
  display: flex;
  align-items: center;
  justify-content: center;
}
.top.on {
  opacity: 1;
  pointer-events: auto;
  transform: none;
}
.top:hover { background: var(--tx); }

/* Animation helpers */
.js .rv {
  opacity: 0;
  transform: translateY(20px);
  transition: opacity .75s var(--ease), transform .75s var(--ease);
  transition-delay: calc(var(--i, 0) * 65ms);
}
.js .rv.vis {
  opacity: 1;
  transform: none;
}
#app {
  transition: opacity .22s var(--ease), transform .22s var(--ease);
  outline: 0;
}
#app.out {
  opacity: 0;
  transform: translateY(10px);
}
.ld { pointer-events: none; opacity: .85; }
.spin {
  display: inline-block;
  width: 15px;
  height: 15px;
  border: 2px solid rgba(255, 255, 255, .4);
  border-top-color: #fff;
  border-radius: 50%;
  animation: sp .65s linear infinite;
}
@keyframes sp { to { transform: rotate(360deg); } }

@media(max-width: 860px) {

}

var prevT = {}, lastRes = '';
function tween(el, k, to, fmt){
  var from = prevT[k] == null ? to : prevT[k];
  prevT[k] = to;
  if(RM || from === to){ el.textContent = fmt(to); return; }
  var t0 = performance.now();
  (function s(n){
    var p = Math.min(1, (n - t0) / 420), e = 1 - Math.pow(1 - p, 3);
    el.textContent = fmt(from + (to - from) * e);
    if(p < 1) requestAnimationFrame(s);
  })(t0);
}

function initCalc(){
  if(!$('#amt')) return;
  var DEF = { amt: 25000, m0: 1.2, f0: 15, m1: 0.6, f1: 25, m2: 0.35, f2: 40 };
  prevT = {};
  var f = function(){
    var a = parseFloat($('#amt').value), c = $('#cur').value, r = [], out = $('#res');
    if(!(a > 0)){
      out.innerHTML = '<div class="note">Enter an amount above zero.</div>';
      lastRes = '';
      return;
    }
    ['A', 'B', 'C'].forEach(function(n, i){
      var m = parseFloat($('#m' + i).value), fe = parseFloat($('#f' + i).value);
      if(!(m >= 0)) m = 0;
      if(!(fe >= 0)) fe = 0;
      r.push({ n: n, t: a * m / 100 + fe });
    });
    var mx = Math.max.apply(null, r.map(function(x){ return x.t; })) || 1;
    var mn = Math.min.apply(null, r.map(function(x){ return x.t; }));
    var nf = new Intl.NumberFormat('en-IN', { maximumFractionDigits: 2 });
    out.innerHTML = r.map(function(x, i){
      return '<div class="rr' + (x.t === mn ? ' best' : '') + '">' +
        '<div class="t"><span>Quote ' + x.n + '</span><span class="tv" data-i="' + i + '"></span></div>' +
        '<div class="bar"><i style="width:' + Math.max(4, x.t / mx * 100) + '%"></i></div>' +
      '</div>';
    }).join('');
    var fmt = function(v){ return c + ' ' + nf.format(v) + ' · ' + (v / a * 100).toFixed(2) + '%'; };
    Array.prototype.forEach.call(out.querySelectorAll('.tv'), function(el){
      var i = +el.getAttribute('data-i');
      tween(el, 'q' + i, r[i].t, fmt);
    });
    lastRes = 'FxPro Cost Check (' + c + ' ' + nf.format(a) + ')\n' +
      r.map(function(x){ return 'Quote ' + x.n + ': ' + fmt(x.t); }).join('\n') +
      '\nLowest: Quote ' + r.filter(function(x){ return x.t === mn; })[0].n;
  };
  Array.prototype.forEach.call(document.querySelectorAll('.cin'), function(e){
    e.addEventListener('input', f);
    e.addEventListener('change', f);
  });
  $('#rs').addEventListener('click', function(){
    Object.keys(DEF).forEach(function(k){ $('#' + k).value = DEF[k]; });
    $('#cur').value = 'USD';
    f();
    toast('Reset to default values');
  });
  $('#cc').addEventListener('click', function(){
    if(!lastRes) return;
    try {
      navigator.clipboard.writeText(lastRes).then(function(){
        toast('Result copied to clipboard');
      }, function(){
        toast('Clipboard copy unavailable');
      });
    } catch(x){
      toast('Clipboard copy unavailable');
    }
  });
  f();
}

/* ---- MOBILE DRAWER LOGIC ---- */
function openMobileDrawer(){
  $('#mobileDrawer').classList.add('open');
  $('#backdrop').classList.add('open');
  $('#burger').setAttribute('aria-expanded', 'true');
  $('#mobileDrawer').setAttribute('aria-hidden', 'false');
  document.body.classList.add('menu-open');
}

function closeMobileDrawer(){
  $('#mobileDrawer').classList.remove('open');
  $('#backdrop').classList.remove('open');
  $('#burger').setAttribute('aria-expanded', 'false');
  $('#mobileDrawer').setAttribute('aria-hidden', 'true');
  document.body.classList.remove('menu-open');
}

function setupMobileDrawerEvents(){
  $('#burger').addEventListener('click', function(){
    var isOpen = $('#mobileDrawer').classList.contains('open');
    if(isOpen) closeMobileDrawer();
    else openMobileDrawer();
  });
  $('#backdrop').addEventListener('click', closeMobileDrawer);
  $('#drawerClose').addEventListener('click', closeMobileDrawer);

  $('#drawerContent').addEventListener('click', function(e){
    var accBtn = e.target.closest('.d-acc-btn');
    if(accBtn){
      e.preventDefault();
      var acc = accBtn.closest('.d-acc');

/* ---- INTERSECTIONS & ANIMATIONS ---- */
var IO = null, SPY = null;
function enhance(key){
  var A = app;
  if(IO){ IO.disconnect(); IO = null; }
  if(SPY){ SPY.disconnect(); SPY = null; }

  var els = A.querySelectorAll('.e-ix a, .serve-card, .challenge-item, .card, .pil, .e-ap > div, .stage-panel, .svb, .about-visual, .services-visual');
  var list = [];
  Array.prototype.forEach.call(els, function(el, idx){
    el.classList.add('rv');
    el.style.setProperty('--i', Math.min(idx % 6, 5));
    list.push(el);
  });

  if(RM || !('IntersectionObserver' in window)){
    list.forEach(function(e){ e.classList.add('vis'); });
  } else {
    IO = new IntersectionObserver(function(entries){
      entries.forEach(function(entry){
        if(entry.isIntersecting){
          entry.target.classList.add('vis');
          IO.unobserve(entry.target);
        }
      });
    }, { threshold: .08, rootMargin: '0px 0px -4% 0px' });
    list.forEach(function(e){ IO.observe(e); });
  }

  if(key === 'services' && 'IntersectionObserver' in window){
    var chips = A.querySelectorAll('.chip[data-s]');
    SPY = new IntersectionObserver(function(entries){
      entries.forEach(function(entry){
        if(entry.isIntersecting){
          Array.prototype.forEach.call(chips, function(c){
            c.classList.toggle('on', c.getAttribute('data-s') === entry.target.id);
          });
        }
      });
    }, { rootMargin: '-25% 0px -65% 0px' });
    Array.prototype.forEach.call(A.querySelectorAll('.svb'), function(s){ SPY.observe(s); });
  }
}

/* ---- ROUTING LOGIC ---- */
function parse(){
  var h = location.hash.replace(/^#\/?/, ''), anchor = '', hi = h.indexOf('#');
  if(hi > -1){ anchor = h.slice(hi + 1); h = h.slice(0, hi); }
  var qs = {}, qi = h.indexOf('?');
  if(qi > -1){
    h.slice(qi + 1).split('&').forEach(function(p){
      var kv = p.split('=');
      if(kv[0]) qs[kv[0]] = decodeURIComponent(kv[1] || '');
    });
    h = h.slice(0, qi);
  }
  var seg = h.split('/').filter(Boolean);
  return { seg: seg, key: seg[0] || 'home', qs: qs, anchor: anchor, path: h + '?' + JSON.stringify(qs) };
}

function render(r){
  var key = r.key, seg = r.seg, html = '', title = 'FxPro';

  if(key === 'contact' && r.qs && r.qs.t === 'consultation'){
    key = 'consultation';
  }

  if(key === 'solutions' && seg[1]){
    html = pages.detail(seg[1]);
    var s = SOL.filter(function(x){ return x.id === seg[1]; })[0];
    title = (s ? s.t : 'Solutions') + ' | FxPro';
  }
  else if(['home', 'about', 'services', 'solutions', 'connect', 'pricing', 'consultation', 'contact', 'privacy', 'terms', 'disclaimer'].indexOf(key) > -1){
    html = pages[key](r.qs);
    title = key === 'home' ? 'FxPro | Global Trade. Smarter Banking. Optimised Treasury.' :
            key === 'consultation' ? 'Book a Strategic Consultation | FxPro' :
            key === 'contact' ? 'Contact Our Advisory Desk | FxPro' :
            key === 'connect' ? 'FxPro Connect | Partner Referral Programme' :
            key.charAt(0).toUpperCase() + key.slice(1) + ' | FxPro';
  }
  else {
    html = pages.notfound();
    key = 'none';
    title = 'Page Not Found | FxPro';
  }

  app.innerHTML = html;
  document.title = title;
  $('#foot').innerHTML = foot();

  Array.prototype.forEach.call(document.querySelectorAll('.links a[data-r], .drawer-content a[data-r]'), function(a){
    a.classList.toggle('on', a.getAttribute('data-r') === key);
  });

  closeMobileDrawer();
  enhance(key);
  initCalc();
  initForms();

  if(r.anchor && $('#' + r.anchor)){
    setTimeout(function(){
      var el = $('#' + r.anchor);
      if(el) el.scrollIntoView({ behavior: RM ? 'auto' : 'smooth' });
    }, RM ? 0 : 300);
  } else {
    window.scrollTo(0, 0);
  }
  onScroll();
}

var curPath = null;
function route(){
  var r = parse();
  if(curPath === r.path && r.anchor){
    var el = $('#' + r.anchor);
    if(el) el.scrollIntoView({ behavior: RM ? 'auto' : 'smooth' });
    return;
  }
  if(curPath === null || RM){
    curPath = r.path;
    render(r);
    return;
  }
  curPath = r.path;
  app.classList.add('out');
  setTimeout(function(){
    window.scrollTo(0, 0);
    render(r);
    app.classList.remove('out');
  }, 200);
}

  requestAnimationFrame(function(){
    var y = window.pageYOffset || 0, h = root.scrollHeight - window.innerHeight;
    $('#prog').style.transform = 'scaleX(' + (h > 0 ? Math.min(1, y / h) : 0) + ')';
    $('.hd').classList.toggle('sc', y > 8);
    $('#top').classList.toggle('on', y > 600);
    tick = false;
  });
}

/* ---- INTERACTIVE FX FORWARD RATE SIMULATOR ---- */
var FXP = { USD:[7, .05], EUR:[19, -.03], GBP:[31, .04], AED:[43, -.01] }, FXD = {}, FXN = 48;
function fxData(k){
  if(FXD[k]) return FXD[k];
  var q = FXP[k][0], d = FXP[k][1], v = 100, a = [];
  for(var i = 0; i < FXN; i++){
    q = (q * 9301 + 49297) % 233280;
    v += (q / 233280 - .5) * 2.2 + d;
    v = Math.max(93.5, Math.min(106.5, v));
    a.push(v);
  }
  return FXD[k] = a;
}
function fxX(i){ return 8 + i * 384 / (FXN - 1); }
function fxY(v){ return 14 + (108 - v) / 16 * 170; }
function fxTxt(k, i){
  var v = fxData(k)[i], g = v - 100;
  return { a: v.toFixed(1), d: (g < 0 ? '−' : '+') + Math.abs(g).toFixed(1) + '%' };
}
function fxSvg(k){
  var a = fxData(k), p = a.map(function(v, i){
    return (i ? 'L' : 'M') + fxX(i).toFixed(1) + ' ' + fxY(v).toFixed(1);
  }).join('');
  var g = [96, 100, 104].map(function(v){
    return '<line class="e-gl" x1="8" x2="392" y1="' + fxY(v) + '" y2="' + fxY(v) + '"/>';
  }).join('');
  return '<svg class="e-plot" viewBox="0 0 400 200" role="img" aria-label="Simulated ' + k + '/INR movement compared with a locked forward rate">' +
    g +
    '<line class="e-lk" x1="8" x2="392" y1="' + fxY(100) + '" y2="' + fxY(100) + '"/>' +
    '<path class="e-line" pathLength="1" d="' + p + '"/>' +
    '<g id="fxc" style="opacity:0">' +
      '<line y1="14" y2="184" stroke="#162522" stroke-opacity=".3"/>' +
      '<circle r="4.5" fill="#fff" stroke="#538C82" stroke-width="2"/>' +
    '</g>' +
  '</svg>';
}
function fxRead(k, i){
  var t = fxTxt(k, i);
  if($('#fxa')) $('#fxa').textContent = t.a;
  if($('#fxd')) $('#fxd').textContent = t.d;
}

D.addEventListener('click', function(e){
  var b = e.target.closest('[data-fx]');
  if(b){
    var k = b.getAttribute('data-fx');
    Array.prototype.forEach.call(D.querySelectorAll('[data-fx]'), function(x){
      x.setAttribute('aria-selected', x === b);
    });
    $('#fxplot').innerHTML = fxSvg(k);
    fxRead(k, FXN - 1);
    return;
  }

  b = e.target.closest('.e-tabs [data-t]');
  if(b){
    var c = b.closest('.e-tabs');
    Array.prototype.forEach.call(c.querySelectorAll('[data-t]'), function(x){
      x.setAttribute('aria-selected', x === b);
    });
    Array.prototype.forEach.call(c.querySelectorAll('[data-p]'), function(x){
      x.hidden = x.getAttribute('data-p') !== b.getAttribute('data-t');
    });
  }
});

D.addEventListener('pointermove', function(e){
  var c = $('#fxc'), s = e.target.closest && e.target.closest('.e-plot');
  if(!c) return;
  if(!s){ c.style.opacity = 0; return; }
  var r = s.getBoundingClientRect();
  var i = Math.max(0, Math.min(FXN - 1, Math.round(((e.clientX - r.left) / r.width * 400 - 8) / (384 / (FXN - 1)))));
  var activeBtn = D.querySelector('[data-fx][aria-selected=true]');
  var k = activeBtn ? activeBtn.getAttribute('data-fx') : 'USD';
  var x = fxX(i), y = fxY(fxData(k)[i]);
  var ln = c.firstChild, ci = c.lastChild;
  ln.setAttribute('x1', x);
  ln.setAttribute('x2', x);
  ci.setAttribute('cx', x);
  ci.setAttribute('cy', y);
  c.style.opacity = 1;
  fxRead(k, i);
});

window.addEventListener('hashchange', route);
route();
})();
