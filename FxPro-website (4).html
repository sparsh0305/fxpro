/* ---- motion and polish ---- */
:root{--ease:cubic-bezier(.22,.61,.36,1);--spring:cubic-bezier(.34,1.56,.64,1)}
.btn{position:relative;overflow:hidden;isolation:isolate;transition:border-color .3s,color .3s,transform .25s var(--ease),box-shadow .3s}
.btn:before{content:'';position:absolute;inset:0;transform:translateY(102%);transition:transform .45s var(--ease);z-index:-1}
.b1:before{background:var(--tx)}.b2:before{background:var(--tint)}.b3:before{background:#fff}
.btn:hover:before{transform:none}.btn:hover{box-shadow:0 12px 24px -16px rgba(22,37,34,.55)}.btn:active{transform:scale(.97)}
.btn span[aria-hidden]{display:inline-block;transition:transform .35s var(--ease)}.btn:hover span[aria-hidden]{transform:translate(3px,-3px)}
.skip{position:fixed;left:16px;top:-60px;z-index:200;background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;text-decoration:none;transition:top .2s}.skip:focus{top:12px}
.prog{position:fixed;left:0;top:0;height:3px;width:100%;transform-origin:0 50%;transform:scaleX(0);background:linear-gradient(90deg,var(--teal),var(--gold));z-index:80;pointer-events:none}
.hd{transition:box-shadow .3s var(--ease),background .3s}.hd.sc{box-shadow:0 12px 30px -24px rgba(22,37,34,.5);background:rgba(251,252,251,.98)}
.nav{transition:padding .3s var(--ease)}.hd.sc .nav{padding-top:7px;padding-bottom:7px}
.brand svg{transition:transform .6s var(--spring)}.brand:hover svg{transform:rotate(-10deg) scale(1.1)}
.links>a:not(.btn),.dd>a{position:relative}.links>a:not(.btn):after,.dd>a:before{content:'';position:absolute;left:0;right:0;bottom:-2px;height:2px;background:var(--teal);transform:scaleX(0);transform-origin:0 50%;transition:transform .35s var(--ease)}
.links>a:not(.btn):hover:after,.dd:hover>a:before{transform:scaleX(1)}.links a.on{border-color:transparent}.links a.on:after{transform:scaleX(1)!important}
.dd{position:relative}.dd>a{padding-right:2px}.dd>a span.cv{display:inline-block;width:6px;height:6px;border-right:1.6px solid currentColor;border-bottom:1.6px solid currentColor;transform:rotate(45deg) translateY(-2px);margin-left:8px;transition:transform .3s var(--ease)}
.dd:hover .cv,.dd.open .cv{transform:rotate(-135deg) translateY(-1px)}
.dm{position:absolute;top:100%;left:-18px;min-width:360px;padding:10px;background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 34px 60px -28px rgba(22,37,34,.45);opacity:0;visibility:hidden;transform:translateY(12px);transition:opacity .25s var(--ease),transform .25s var(--ease),visibility .25s;z-index:5}
.dd:hover .dm,.dd:focus-within .dm,.dd.open .dm{opacity:1;visibility:visible;transform:none}
.links .dm a{display:block;padding:10px 14px;border-radius:10px;border:0;font-size:14.5px;color:var(--ink);position:relative;transition:background .2s,padding-left .25s var(--ease)}
.links .dm a:after{display:none}.links .dm a:hover{background:var(--tint);padding-left:20px;color:var(--ink)}.links .dm a small{display:block;font-size:12px;color:var(--mut);font-weight:400}
#app{transition:opacity .25s var(--ease),transform .25s var(--ease);outline:0}#app.out{opacity:0;transform:translateY(12px)}
.js .rv{opacity:0;transform:translateY(28px);transition:opacity .9s var(--ease),transform .9s var(--ease);transition-delay:calc(var(--i,0)*80ms)}.js .rv.vis{opacity:1;transform:none}
.js .hero .a{opacity:0;animation:up 1s var(--ease) forwards;animation-delay:calc(var(--d,0)*120ms + 220ms)}.intro-on .hero .a{animation-delay:calc(var(--d,0)*120ms + 1000ms)}

{id:'inward',k:'A',t:'Inward Remittances',s:'Collecting money from abroad',h:'Receive Globally. Settle Efficiently. Stay Compliant.',d:'FxPro coordinates the operational lifecycle of eligible export receipts, from collection arrangements and transaction tracking to FX settlement coordination and regulatory documentation.',f:[['Global Collection Infrastructure','Multi-currency virtual accounts and local collection rails in supported markets, subject to provider availability and eligibility.'],['Optimised FX & INR Settlement','Competitive FX pricing, transparent settlement economics and access to eligible spot or forward contracts at agreed market-linked rates.'],['Dedicated Merchant Dashboard','Transaction visibility, settlement status, reconciliation support and historical transaction information, where provided by the platform partner.'],['Export Compliance Support','Support for purpose documentation, e-BRC follow-up, applicable export declarations and related regulatory closure workflows.']],o:'Better collection visibility, streamlined workflows and improved control over export receivables.',n:'Any \u201czero FX markup\u201d positioning applies only where it reflects the actual commercial terms of the relevant product. FX markup is distinct from the underlying exchange rate, conversion charges and other applicable fees. Real-time tracking is subject to platform capabilities.'},
{id:'outward-remittances',k:'B',t:'Outward Remittances',s:'Import payments and international fund transfers',h:'Smarter Import Payments. Controlled Costs. Stronger Compliance.',d:'FxPro coordinates international payment workflows, documentation, FX booking support, banking follow-ups and transaction closure.',f:[['Transaction Outsourcing','Payment initiation coordination, documentation checks, bank follow-ups and payment status tracking.'],['FX Booking & Hedging','Support with spot, forward and other eligible hedging arrangements through authorised counterparties.'],['Merchanting Trade & High-Seas Sales (HSS)','Transaction structuring and documentation coordination, subject to applicable requirements.'],['Trade Finance Support','Access facilitation for eligible import funding and working capital solutions.'],['LC & Bank Guarantee Cost Management','Review of pricing, commissions, collateral requirements and alternative banking proposals.'],['Foreign Currency Funding','Assessment and facilitation of eligible foreign-currency funding options, including advance-import funding where permitted.'],['Delayed & Third-Party Payment Support','Assessment of delayed import payments and third-party payment arrangements against applicable regulatory and bank requirements.'],['BOE\u2013ORM Closure Support','Reconciliation and follow-up for outstanding bills of entry and outward remittance records.']],o:'Better payment visibility, fewer fragmented follow-ups and more disciplined transaction management.'},
{id:'trade-finance',k:'C',t:'Trade Finance Solutions',s:'Structured funding, better banking coordination',h:'Capital Structured Around Your Trade Cycle.',d:'We help businesses evaluate eligible trade finance options, compare commercial terms and coordinate documentation and execution with lending institutions.',l:['Pre-Shipment Credit in Foreign Currency (PCFC)','Export Packing Credit (EPC)','Post-Shipment Export Finance','Buyer\u2019s Credit and Supplier\u2019s Credit, where permitted','Foreign Currency Demand Loan (FCDL)','Export Bill Discounting','Letter of Credit (LC) Structuring Support','Bank Guarantee (BG) Cost Optimisation','Working Capital & Trade Credit Advisory'],n:'Funding is subject to lender assessment, product eligibility and applicable regulations.'},
{id:'hedging',k:'D',t:'Hedging Solutions',s:'Better visibility over currency risk',h:'Turn Currency Risk Into Strategic Control.',d:'We support exposure assessment, rate comparison, forward booking coordination and reporting to help businesses manage foreign exchange risk more systematically.',l:['Foreign Exchange Exposure Assessment','Forward Contract Booking Support','Spot and Forward Rate Comparison','Hedge Planning and Exposure Mapping','Import and Export Payable/Receivable Matching','Hedge maturity and utilisation tracking','Currency Risk Reporting','FX Policy and Internal Control Framework'],n:'Hedging is executed through authorised counterparties.'},
